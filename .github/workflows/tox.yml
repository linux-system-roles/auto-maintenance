name: tox
on:  # yamllint disable-line rule:truthy
  - pull_request
  - push
jobs:
  python:
    strategy:
      matrix:
        pyver_os:
          - ver: '3.8'
            os: ubuntu-latest
          - ver: '3.9'
            os: ubuntu-latest
          - ver: '3.10'
            os: ubuntu-latest
          - ver: '3.11'
            os: ubuntu-latest
          - ver: '3.13'
            os: ubuntu-latest
          - ver: '3.14'
            os: ubuntu-latest
    runs-on: ${{ matrix.pyver_os.os }}
    steps:
      - name: checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.pyver_os.ver }}
      - name: Install platform dependencies, python, tox
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install tox
      - name: Run tox tests
        run: |
          set -euxo pipefail
          # only run black on the latest python version (currently 3.14)
          tox_env="flake8,pylint,pytest,shellcheck"
          if [ "${{ matrix.pyver_os.ver }}" = "3.14" ]; then
            tox_env="${tox_env},black"
          fi
          tox -e "$tox_env"
